<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inner Sense Therapy | Coming Soon</title>
  <meta name="description" content="Inner Sense Therapy - Cognitive Behavioural Therapy services coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-1: #e8f5e9;
      --green-2: #c8e6c9;
      --green-3: #a5d6a7;
      --green-4: #81c784;
      --green-dark: #1b5e20;
      --text-dark: #1b3a1b;
      --text-mid: #4a6b4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.6) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.5) 0%, transparent 45%),
        linear-gradient(135deg, var(--green-1) 0%, var(--green-2) 40%, var(--green-3) 70%, var(--green-4) 100%);
      background-attachment: fixed;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 6vw, 5rem);
      width: min(100%, 1200px);
    }

    .logo {
      flex: 0 1 360px;
      max-width: min(50vw, 360px);
      filter: drop-shadow(0 4px 18px rgba(27, 94, 32, 0.18));
    }

    .logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .logo svg :is(path, circle, line, ellipse, rect, polyline) {
      stroke: var(--green-dark);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .text {
      flex: 1 1 auto;
      text-align: left;
      min-width: 260px;
    }

    .coming-soon {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-mid);
      margin-bottom: 1rem;
    }

    .brand {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--text-dark);
      text-shadow: 0 2px 12px rgba(27, 58, 27, 0.12);
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text-mid);
      margin-top: 1.5rem;
      letter-spacing: 0.05em;
      max-width: 34ch;
    }

    @media (max-width: 680px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }
      .logo {
        max-width: min(70vw, 280px);
      }
      .text {
        text-align: center;
      }
      .tagline {
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero" role="main">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <path d="M110 185
                 C90 185 75 180 65 170

                 C45 122 38 108 42 90
                 C46 72 62 62 78 60
                 C86 40 102 30 122 28
                 C142 26 158 36 168 52
                 C182 56 190 70 190 88
                 C190 104 180 116 168 122
                 C174 138 170 154 160 168
                 C150 180 132 185 116 185
                 L114 185 L112 200 L108 185 Z" />

        <path d="M58 130 C72 128 86 122 96 112 C106 102 112 88 112 70" />
        <path d="M96 112 C112 106 128 108 140 116 C152 124 160 140 162 158" />
        <path d="M140 116 C154 104 172 100 186 104" />
        <path d="M112 70 C114 54 124 44 138 40 C152 36 166 40 174 50" />

        <path d="M72 86 C72 74 80 66 90 66 C100 66 108 74 108 84 C108 94 100 102 90 102 C80 102 72 96 72 86 Z" />
        <path d="M90 66 L90 84 L100 76" />
        <path d="M82 84 L98 84" />

      </svg>
    </div>
    <div class="text">
      <p class="coming-soon">Coming Soon</p>
      <h1 class="brand">Inner Sense Therapy</h1>
      <p class="tagline">A calm, clear space for CBT and talking therapy.</p>
    </div>
  </main>
</body>
</html>
