<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inner Sense Therapy | Coming Soon</title>
  <meta name="description" content="Inner Sense Therapy - Cognitive Behavioural Therapy services coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-1: #d6ddd3;
      --green-2: #b0bea9;
      --green-3: #8b9e82;
      --green-4: #6b7f63;
      --green-dark: #243d21;
      --text-dark: #0a0a0a;
      --text-mid: #374731;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.35) 0%, transparent 45%),
        linear-gradient(135deg, var(--green-1) 0%, var(--green-2) 40%, var(--green-3) 70%, var(--green-4) 100%);
      background-attachment: fixed;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(2.5rem, 7vw, 6rem);
      width: min(100%, 1200px);
    }

    .logo {
      flex: 0 1 320px;
      max-width: min(42vw, 320px);
    }

    .logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .logo svg :is(path, circle, line, ellipse, polyline) {
      fill: none;
      stroke: var(--green-dark);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo .bulb {
      stroke-width: 8;
    }

    .logo .bulb-glow line {
      stroke-width: 5;
    }

    .text {
      flex: 1 1 auto;
      text-align: left;
      min-width: 260px;
      overflow: visible;
    }

    .coming-soon {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.2rem, 2.4vw, 1.9rem);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-mid);
      margin-bottom: 1.2rem;
      margin-top: -0.8rem;
    }

    .brand {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.8rem, 4.2vw, 3.4rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-transform: uppercase;
      color: var(--text-dark);
    }

    .tagline {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.95rem, 1.8vw, 1.4rem);
      font-weight: 400;
      color: var(--text-mid);
      margin-top: 1.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      max-width: 42ch;
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      .hero {
        flex-direction: column;
        text-align: center;
        gap: 1.8rem;
      }
      .logo {
        max-width: min(55vw, 260px);
      }
      .coming-soon {
        margin-top: 0;
        font-size: clamp(1rem, 4vw, 1.4rem);
        letter-spacing: 0.25em;
      }
      .brand {
        font-size: clamp(1.5rem, 7vw, 2.6rem);
        letter-spacing: 0.06em;
      }
      .tagline {
        font-size: clamp(0.8rem, 3.5vw, 1.1rem);
        letter-spacing: 0.08em;
        max-width: none;
      }
      .text {
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero" role="main">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <!-- Clean brain outline (Phosphor brain icon, MIT license) -->
        <path d="M232 124a56 56 0 0 0-32-50.6V72a48 48 0 0 0-88-26.5A48 48 0 0 0 24 72v1.4a56 56 0 0 0 0 101.2V176a48 48 0 0 0 88 26.5A48 48 0 0 0 200 176v-1.4A56 56 0 0 0 232 124Z" />
        <path d="M72 208a32 32 0 0 1-32-28.6A56 56 0 0 0 48 180h8a8 8 0 0 0 0-16H48a40 40 0 0 1-13.3-77.7 8 8 0 0 0 5.3-7.6V72a32 32 0 0 1 64 0v68.3A48 48 0 0 0 72 128a8 8 0 0 0 0 16 32 32 0 0 1 0 64Z" />
        <path d="M176 164h-8a8 8 0 0 0 0 16h8a56 56 0 0 0 8-.6 32 32 0 1 1-32-35.4 8 8 0 0 0 0-16 48 48 0 0 0-32 12.3V72a32 32 0 0 1 64 0v6.7a8 8 0 0 0 5.3 7.5A40 40 0 0 1 176 164Z" />
        <path d="M192 112a8 8 0 0 1-8 8h-4a36 36 0 0 1-36-36V80a8 8 0 0 1 16 0v4a20 20 0 0 0 20 20h4a8 8 0 0 1 8 8Z" />
        <path d="M60 120H56a8 8 0 0 1 0-16h4a20 20 0 0 0 20-20V80a8 8 0 0 1 16 0v4a36 36 0 0 1-36 36Z" />

        <!-- Lightbulb eureka moment nested in the upper-left lobe -->
        <g class="bulb">
          <path d="M64 48a24 24 0 1 1 48 0 24 24 0 1 1-48 0Z" />
          <path d="M76 60h24v12a12 12 0 0 1-12 12 12 12 0 0 1-12-12V60Z" />
          <path d="M82 84h12v12H82Z" />
        </g>
        <g class="bulb-glow">
          <line x1="88" y1="12" x2="88" y2="4" />
          <line x1="62" y1="22" x2="56" y2="16" />
          <line x1="114" y1="22" x2="120" y2="16" />
        </g>
      </svg>
    </div>
    <div class="text">
      <p class="coming-soon">Coming Soon</p>
      <h1 class="brand">Inner Sense Therapy</h1>
      <p class="tagline">A calm, clear space for CBT and talking therapy.</p>
    </div>
  </main>
</body>
</html>
