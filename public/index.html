<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inner Sense Therapy | Coming Soon</title>
  <meta name="description" content="Inner Sense Therapy - Cognitive Behavioural Therapy services coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-1: #d6ddd3;
      --green-2: #b0bea9;
      --green-3: #8b9e82;
      --green-4: #6b7f63;
      --green-dark: #243d21;
      --text-dark: #0a0a0a;
      --text-mid: #374731;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.35) 0%, transparent 45%),
        linear-gradient(135deg, var(--green-1) 0%, var(--green-2) 40%, var(--green-3) 70%, var(--green-4) 100%);
      background-attachment: fixed;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(2.5rem, 7vw, 6rem);
      width: min(100%, 1200px);
    }

    .logo {
      flex: 0 1 320px;
      max-width: min(42vw, 320px);
    }

    .logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .logo svg :is(path, circle, line, ellipse, polyline) {
      fill: none;
      stroke: var(--green-dark);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo .bulb, .logo .eye {
      stroke-width: 2.5;
    }

    .text {
      flex: 1 1 auto;
      text-align: left;
      min-width: 260px;
      overflow: visible;
    }

    .coming-soon {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.2rem, 2.4vw, 1.9rem);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-mid);
      margin-bottom: 1.2rem;
      margin-top: -0.8rem;
    }

    .brand {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.8rem, 4.2vw, 3.4rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      line-height: 1.15;
      text-transform: uppercase;
      color: var(--text-dark);
    }

    .tagline {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.95rem, 1.8vw, 1.4rem);
      font-weight: 400;
      color: var(--text-mid);
      margin-top: 1.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      max-width: 42ch;
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      .hero {
        flex-direction: column;
        text-align: center;
        gap: 1.8rem;
      }
      .logo {
        max-width: min(55vw, 260px);
      }
      .coming-soon {
        margin-top: 0;
        font-size: clamp(1rem, 4vw, 1.4rem);
        letter-spacing: 0.25em;
      }
      .brand {
        font-size: clamp(1.5rem, 7vw, 2.6rem);
        letter-spacing: 0.06em;
      }
      .tagline {
        font-size: clamp(0.8rem, 3.5vw, 1.1rem);
        letter-spacing: 0.08em;
        max-width: none;
      }
      .text {
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero" role="main">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer brain shape -->
        <path d="M100 165
                 C75 165 58 156 52 140
                 C46 124 48 108 58 96
                 C42 88 34 74 38 58
                 C42 42 56 34 72 34
                 C80 22 96 16 114 16
                 C132 16 148 24 158 38
                 C174 42 182 54 182 70
                 C182 86 174 96 162 102
                 C168 118 164 134 154 144
                 C144 154 128 153 112 153
                 L108 153 L106 166 L102 153 Z" />
        
        <!-- Brain folds / squiggles -->
        <path d="M58 96 C74 94 88 86 98 74 C108 62 114 46 114 28" />
        <path d="M98 74 C116 68 134 72 146 82 C158 92 164 108 164 126" />
        <path d="M146 82 C158 70 174 66 188 70" />
        <path d="M114 28 C116 16 124 8 136 6 C148 4 160 8 168 16" />

        <!-- Lightbulb in upper-left lobe -->
        <g class="bulb">
          <path d="M68 52 C68 38 78 28 90 28 C102 28 112 38 112 52 C112 62 106 70 100 76 L100 86 L80 86 L80 76 C74 70 68 62 68 52 Z" />
          <path d="M80 86 L80 94 L100 94 L100 86" />
          <path d="M84 94 L84 102 L96 102 L96 94" />
          <!-- bulb filament -->
          <path d="M84 52 L90 44 L96 52" />
          <!-- shine lines -->
          <line x1="90" y1="18" x2="90" y2="10" />
          <line x1="72" y1="26" x2="66" y2="20" />
          <line x1="108" y1="26" x2="114" y2="20" />
        </g>

        <!-- Closed eye with lashes in upper-right lobe -->
        <g class="eye">
          <path d="M130 46 C138 42 148 42 156 46" />
          <path d="M134 46 L132 38" />
          <path d="M143 45 L143 36" />
          <path d="M152 46 L154 38" />
        </g>
      </svg>
    </div>
    <div class="text">
      <p class="coming-soon">Coming Soon</p>
      <h1 class="brand">Inner Sense Therapy</h1>
      <p class="tagline">A calm, clear space for CBT and talking therapy.</p>
    </div>
  </main>
</body>
</html>
